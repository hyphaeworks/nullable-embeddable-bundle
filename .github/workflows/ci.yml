name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  qa:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer cs:check

      - run: composer phpstan

  tests:
    name: PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} · ORM ${{ matrix.orm }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        symfony: [ '6.4', '7.4', '8' ]
        orm: [ '^2.17', '^3.0' ]
        dependencies: [ highest, lowest ]
        exclude:
          - symfony: '8'
            php: '8.2'
          - symfony: '8'
            php: '8.3'
          - symfony: '8'
            orm: '^2.17'
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}.*
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - run: |
          composer remove --dev --no-update friendsofphp/php-cs-fixer phpstan/phpstan phpstan/extension-installer phpstan/phpstan-doctrine phpstan/phpstan-phpunit phpstan/phpstan-strict-rules
          composer require --no-update "doctrine/orm:${{ matrix.orm }}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit
